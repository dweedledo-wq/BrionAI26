<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>BRIONAI26 — COMMAND CENTER</title>
<style>
/* BrionAI26 — FUI-shell v2.1: DE FOTO IS HET SCHERM.
 * Referentie: brand/reference foto (PoI-FUI) fullscreen via cover.
 * Live HUD-readouts als dunne overlays in fotostijl; geen eigen decor. */
:root {
  --steel:     #2683C0;
  --steel-br:  #3296E0;
  --gold:      #F0C090;
  --amber:     #FFB300;
  --red:       #FF3B4E;
  --txt-main:  #CDD8E1;
  --txt-dim:   #7A93B8;
  --hud-bg:    rgba(4, 9, 18, 0.55);
  --hud-brd:   rgba(38, 131, 192, 0.55);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace;
  font-weight: bold;
  color: var(--txt-main);
}
/* LAAG 1 — de foto zelf, verliesvrij fullscreen */
#foto {
  position: fixed; inset: 0;
  background: url("assets/referentie.jpg") no-repeat center center;
  background-size: cover;
  image-rendering: auto;
  z-index: 0;
}
/* LAAG 2 — cinema: scanlines + vignette (fotogevoel, subtiel) */
#scan {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0) 0px, rgba(0,0,0,0) 3px,
    rgba(0,0,0,0.14) 4px
  );
}
#vignette {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.38) 100%);
}
/* LAAG 3 — levende HUD-readouts (fotostijl: dun, glas, staalblauw randgloed) */
.hud {
  position: fixed; z-index: 2;
  background: var(--hud-bg);
  border: 1px solid var(--hud-brd);
  border-radius: 3px;
  padding: 8px 12px;
  font-size: 12px;
  letter-spacing: 0.06em;
  box-shadow: 0 0 8px rgba(38,131,192,0.25), inset 0 0 18px rgba(38,131,192,0.06);
  backdrop-filter: blur(2px);
  min-width: 170px;
}
.hud .kop {
  font-size: 10px; color: var(--txt-dim);
  letter-spacing: 0.22em; margin-bottom: 5px;
  border-bottom: 1px solid rgba(38,131,192,0.35);
  padding-bottom: 3px;
  display: flex; justify-content: space-between; align-items: center;
}
.groot { font-size: 20px; color: var(--txt-main); }
.sub   { font-size: 10px; color: var(--txt-dim); margin-top: 3px; }
.gold  { color: var(--gold); }
.led {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--steel); box-shadow: 0 0 6px var(--steel);
  vertical-align: middle;
}
.led.warn { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
.led.crit { background: var(--red); box-shadow: 0 0 6px var(--red); animation: knipper 0.8s infinite; }
@keyframes knipper { 50% { opacity: 0.25; } }
.balk-outer {
  height: 3px; background: rgba(38,131,192,0.15);
  border-radius: 2px; margin-top: 5px; overflow: hidden;
}
.balk {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--steel), var(--steel-br));
  box-shadow: 0 0 6px rgba(38,131,192,0.6);
  transition: width 0.6s ease;
}
.balk.warn { background: linear-gradient(90deg, #C78F00, var(--amber)); }
.balk.crit { background: linear-gradient(90deg, #B31021, var(--red)); }
/* positie: hoeken van het scherm, foto blijft maximaal zichtbaar */
#hud-merk   { top: 14px;    left: 14px;    }
#hud-klok    { top: 14px;    left: 210px;  text-align: left; }
#hud-cpu     { top: 14px;    right: 14px;  }
#hud-ram     { top: 130px;   right: 14px;  }
#hud-net     { bottom: 14px; right: 14px;  }
#hud-disk    { bottom: 14px; left: 14px;   }
#hud-systeem { bottom: 14px; left: 210px;  }
.kol { display: flex; flex-direction: column; gap: 3px; font-size: 11px; }
.kol .regel { display: flex; justify-content: space-between; gap: 14px; }
.kol .waarde { color: var(--txt-main); }
.kol .label { color: var(--txt-dim); }
.ok { color: var(--steel-br); }
</style>
</head>
<body>
  <div id="foto"></div>
  <div id="scan"></div>
  <div id="vignette"></div>

  <div class="hud" id="hud-merk">
    <div class="kop">SYS/ID</div>
    <div class="groot gold">BRIONAI26</div>
    <div class="sub">COMMAND CENTER · LIVE</div>
  </div>

  <div class="hud" id="hud-klok">
    <div class="kop">LOKALE TIJD <span class="led" id="led-klok"></span></div>
    <div class="groot" id="klok-tijd">--:--:--</div>
    <div class="sub" id="klok-datum">-</div>
  </div>

  <div class="hud" id="hud-cpu">
    <div class="kop">CPU <span class="led" id="led-cpu"></span></div>
    <div class="groot"><span id="cpu-pct">--</span><span style="font-size:12px;color:var(--txt-dim)">%</span></div>
    <div class="balk-outer"><div class="balk" id="cpu-balk"></div></div>
    <div class="sub" id="cpu-sub">kernen: --</div>
  </div>

  <div class="hud" id="hud-ram">
    <div class="kop">RAM <span class="led" id="led-ram"></span></div>
    <div class="groot"><span id="ram-pct">--</span><span style="font-size:12px;color:var(--txt-dim)">%</span></div>
    <div class="balk-outer"><div class="balk" id="ram-balk"></div></div>
    <div class="sub" id="ram-sub">-- / -- GB</div>
  </div>

  <div class="hud" id="hud-net">
    <div class="kop">NETWERK <span class="led" id="led-net"></span></div>
    <div class="kol">
      <div class="regel"><span class="label">DOWN</span><span class="waarde" id="net-down">--</span></div>
      <div class="regel"><span class="label">UP</span><span class="waarde" id="net-up">--</span></div>
      <div class="regel"><span class="label">TAILSCALE</span><span class="waarde" id="ts-status">--</span></div>
    </div>
    <div class="sub" id="net-if">interfaces: --</div>
  </div>

  <div class="hud" id="hud-disk">
    <div class="kop">DISK <span class="led" id="led-disk"></span></div>
    <div class="groot"><span id="disk-pct">--</span><span style="font-size:12px;color:var(--txt-dim)">%</span></div>
    <div class="balk-outer"><div class="balk" id="disk-balk"></div></div>
    <div class="sub" id="disk-sub">-- / -- GB</div>
  </div>

  <div class="hud" id="hud-systeem">
    <div class="kop">SYSTEEM <span class="led" id="led-svc"></span></div>
    <div class="kol">
      <div class="regel"><span class="label">UPTIME</span><span class="waarde" id="uptime">--</span></div>
      <div class="regel"><span class="label">PM2</span><span class="waarde" id="pm2-online">--</span></div>
      <div class="regel"><span class="label">SYSDASH</span><span class="waarde" id="sysdash-status">--</span></div>
    </div>
    <div class="sub" id="load-sub">load: --</div>
  </div>

  <script src="wand.js"></script>
</body>
</html>
