name: Build ISO

on:
  push:
    paths:
      - 'bin/**'
      - '.github/workflows/build-iso.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-iso
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ISO in privileged Debian container
        run: |
          sh bin/build-iso-docker || BUILD_RC=$?
          if [ "${BUILD_RC:-0}" -ne 0 ]; then
            echo "== BUILD GEFAALD (exit $BUILD_RC) — laatste 80 regels live-build-log: =="
            docker run --privileged --rm \
              --volume "${PWD}/build:/app/build" \
              debian:stable \
              sh -c 'tail -80 /app/build/live-build.log 2>/dev/null || find /app/build -name "*.log" -exec tail -40 {} \; 2>/dev/null || echo "geen log gevonden"'
            exit $BUILD_RC
          fi

      - name: Verify build artifacts
        run: |
          test -f dist/brionai26-amd64.hybrid.iso
          test -f dist/SHA256SUMS
          cd dist && sha256sum --check SHA256SUMS && cd ..
          ls -lah dist/

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: brionai26-amd64-hybrid-iso
          path: dist/*
          retention-days: 14
          if-no-files-found: error
