name: Build ISO
on:
  push:
    paths:
      - 'bin/**'
      - 'config/**'
      - 'desktop/**'
      - '.github/workflows/build-iso.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-iso
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build ISO in privileged Debian container
        run: |
          sh bin/build-iso-docker || BUILD_RC=$?
          if [ "${BUILD_RC:-0}" -ne 0 ]; then
            echo "== BUILD GEFAALD (exit $BUILD_RC) — laatste regels live-build-log: =="
            docker run --privileged --rm \
              --volume "${PWD}/build:/app/build" \
              debian:stable \
              sh -c 'tail -120 /app/build/live-build.log 2>/dev/null || find /app/build -maxdepth 2 -type f | head -30' > /tmp/fail.log 2>&1
            # Fout zichtbaar maken in de check-run-annotatie (API-leesbaar)
            {
              echo "BUILD-FAIL exit=$BUILD_RC"
              tail -c 600 /tmp/fail.log | tr '\n' '|'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::BUILD-FAIL exit=$BUILD_RC $(tail -c 400 /tmp/fail.log | tr '\n' ' ')"
            exit $BUILD_RC
          fi
      - name: Verify build artifacts
        run: |
          test -f dist/brionai26-amd64.hybrid.iso
          test -f dist/SHA256SUMS
          cd dist && sha256sum --check SHA256SUMS && cd ..
          ls -lah dist/
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: brionai26-amd64-hybrid-iso
          path: dist/*
          retention-days: 14
          if-no-files-found: error
      - name: Publish ISO as public GitHub Release
        run: |
          TAG="iso-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "BrionAI26 ISO $TAG" \
            --notes "Automatische build van main. Zie SHA256SUMS voor de checksum. Live-boot vanaf USB raakt de interne schijf niet aan." \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
