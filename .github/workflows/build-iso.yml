name: Build ISO

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ISO in privileged Debian container
        run: sh bin/build-iso-docker

      - name: Verify build artifacts
        run: |
          test -f dist/brionai26-amd64.hybrid.iso
          test -f dist/SHA256SUMS
          cd dist && sha256sum --check SHA256SUMS && cd ..
          ls -lah dist/

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: brionai26-amd64-hybrid-iso
          path: dist/*
          retention-days: 14
          if-no-files-found: error
