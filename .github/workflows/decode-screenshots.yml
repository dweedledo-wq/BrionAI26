name: Decode screenshots
on:
  push:
    paths:
      - 'docs/screenshots/**'
      - '.github/workflows/decode-screenshots.yml'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decode b64 screenshot-parts to JPG and verify checksums
        run: |
          set -eu
          cd docs/screenshots
          ok=1
          for b in *.jpg.b64.p000; do
            base="${b%.p000}"
            cat "$base".p[0-9][0-9][0-9] | base64 -d > "${base%.b64}"
          done
          sha256sum -c SHA256SUMS || ok=0
          [ "$ok" -eq 1 ]

      - name: Commit decoded screenshots and clean up
        run: |
          git config user.name "brionize"
          git config user.email "dweedledo@gmail.com"
          git rm -q --ignore-unmatch docs/screenshots/*.jpg.b64.p[0-9][0-9][0-9] docs/screenshots/*.b64 docs/screenshots/*.part* docs/screenshots/screenshot-05-rode-test-wallpaper-small.png || true
          git add docs/screenshots/*.jpg
          git diff --cached --quiet && echo "niets te committen" && exit 0
          git commit -m "docs: screenshots gedecodeerd van b64-parts (CI-geverifieerd)"
          git push