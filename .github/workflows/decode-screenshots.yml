name: Decode screenshots
on:
  push:
    paths:
      - 'docs/screenshots/**'
      - '.github/workflows/decode-screenshots.yml'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decode b64 screenshot-parts to PNG and verify checksums
        run: |
          set -eu
          cd docs/screenshots
          ok=1
          while read -r sum name; do
            if ! ls "$name".b64.part* >/dev/null 2>&1; then
              echo "MISSING parts voor $name"
              ok=0
              continue
            fi
            cat "$name".b64.part* | base64 -d > "$name"
            if echo "$sum  $name" | sha256sum -c -; then
              echo "OK $name"
            else
              echo "CHECKSUM FAIL $name"
              ok=0
            fi
          done < SHA256SUMS
          [ "$ok" -eq 1 ]

      - name: Commit decoded PNGs and clean up
        run: |
          git config user.name "brionize"
          git config user.email "dweedledo@gmail.com"
          git rm --ignore-unmatch 'docs/screenshots/*.b64' 'docs/screenshots/screenshot-05-rode-test-wallpaper-small.png' || true
          git add docs/screenshots/*.png
          git diff --cached --quiet && echo "niets te committen" && exit 0
          git commit -m "docs: screenshots gedecodeerd van b64-parts (CI-geverifieerd)"
          git push
