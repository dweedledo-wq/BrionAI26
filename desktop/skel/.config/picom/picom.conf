# picom — glas-effect voor BrionAI26 (xrender-backend: werkt zonder GPU)
# Kleuren/transparantie: zie brand/theme/mission-control.conf
backend = "xrender";
vsync = false;

# Zachte schaduwen + glas (vensters bovenop de donkere wand)
shadow = true;
shadow-radius = 12;
shadow-offset-x = -4;
shadow-offset-y = -4;
shadow-opacity = 0.45;
shadow-ignore-zero-shaped = true;

fading = true;
fade-in-step = 0.12;      # soepel in-klappen tegels
fade-out-step = 0.12;
fade-delta = 6;

# Glas-transparantie alleen op uitdrukkelijk gemarkeerde vensters
# (xfce4-panel en Conky krijgen in hun eigen config een alpha-marker)
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
