conky.config = {
    -- BrionAI26 mission-control HUD (werkblad 1: Command Center)
    -- Kleuren: brand/theme/mission-control.conf (goud/amber + cyan)
    alignment = 'top_right',
    background = false,
    border_inner_margin = 12,
    border_outer_margin = 6,
    default_color = '#D7E6F0',
    default_outline_color = '#131A21',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    font = 'JetBrainsMono:size=10:bold',
    gap_x = 12,
    gap_y = 48,
    maximum_width = 340,
    own_window = true,
    own_window_class = 'Conky HUD',
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    update_interval = 2,
    use_xft = true,
    xftalpha = 1.0,
}

conky.text = [[
${color #D8A878}${font JetBrainsMono:size=16:bold}BRIONAI26${font}${color}
${color #6B8399}mission control${color}
${color #F0C090}${stippled_hr 2}${color}
${color #00E5FF}◉ SYS ${color #6B8399}// ${color}$nodename
${color #00E5FF}◉ CPU ${color #6B8399}// ${color}${cpu cpu0}% ${cpubar 8,120 ffcc99 D8A878}
${color #00E5FF}◉ RAM ${color #6B8399}// ${color}$memperc% ${membar 8,120 ffcc99 D8A878}
${color #00E5FF}◉ DSK ${color #6B8399}// ${color}${fs_used_perc /}% ${fsbar 8,120 ffcc99 D8A878}
${color #00E5FF}◉ NET ${color #6B8399}// ${color}${upspeedf}↑ ${downspeedf}↓
${color #00E5FF}◉ BAT ${color #6B8399}// ${color}${battery_percent BAT0}%
${color #F0C090}${stippled_hr 2}${color}
${color #F0C090}TS${color} ${execi 30 tailscale status --peers=false --self=false 2>/dev/null || echo 'niet actief'}
${color #F0C090}UPT${color} $uptime
${color #F0C090}KRN${color} $kernel
]]
