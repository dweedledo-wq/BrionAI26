conky.config = {
    -- BrionAI26 mission-control HUD (werkblad 1: Command Center)
    -- Kleuren: brand/theme/mission-control.conf (staalblauw + goud alleen merk)
    alignment = 'top_right',
    background = false,
    border_inner_margin = 12,
    border_outer_margin = 6,
    default_color = '#CDD8E1',
    default_outline_color = '#0A1424',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    font = 'JetBrainsMono:size=10:bold',
    gap_x = 12,
    gap_y = 48,
    maximum_width = 340,
    own_window = true,
    own_window_class = 'Conky HUD',
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    update_interval = 2,
    use_xft = true,
    xftalpha = 1.0,
}

conky.text = [[
${color #2683C0}${font JetBrainsMono:size=16:bold}BRIONAI26${font}${color}
${color #7A93B8}mission control${color}
${color #F0C090}${stippled_hr 2}${color}
${color #3270C5}◉ SYS ${color #7A93B8}// ${color}$nodename
${color #3270C5}◉ CPU ${color #7A93B8}// ${color}${cpu cpu0}% ${cpubar 8,120 3270C5 2683C0}
${color #3270C5}◉ RAM ${color #7A93B8}// ${color}$memperc% ${membar 8,120 3270C5 2683C0}
${color #3270C5}◉ DSK ${color #7A93B8}// ${color}${fs_used_perc /}% ${fsbar 8,120 3270C5 2683C0}
${color #3270C5}◉ NET ${color #7A93B8}// ${color}${upspeedf}↑ ${downspeedf}↓
${color #3270C5}◉ BAT ${color #7A93B8}// ${color}${battery_percent BAT0}%
${color #F0C090}${stippled_hr 2}${color}
${color #F0C090}TS${color} ${execi 30 tailscale status --peers=false --self=false 2>/dev/null || echo 'niet actief'}
${color #F0C090}UPT${color} $uptime
${color #F0C090}KRN${color} $kernel
]]
