conky.config = {
-- BrionAI26 mission-control HUD (werkblad 1: Command Center)
-- Kleuren: brand/theme/mission-control.conf (goud/amber + cyan)
    alignment = 'top_right',
    background = false,
    border_inner_margin = 12,
    border_outer_margin = 6,
    default_color = '#D7E6F0',
    default_outline_color = '#131A21',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    font = 'Monospace:size=10:bold',
    gap_x = 12,
    gap_y = 48,
    maximum_width = 340,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    update_interval = 2,
    use_xft = true,
    xftalpha = 1.0,
}

conky.text = [[
${color #D8A878}${font Monospace:size=13:bold}BRIONAI26${font}${color}
${color #6B8399}mission control${color}
${color #F0C090}${stippled_hr 2}${color}
${color #F0C090}CPU${color}  ${cpu cpu0}%  ${cpubar 8,120 ffcc99 D8A878}
${color #F0C090}RAM${color}  $memperc%  ${membar 8,120 ffcc99 D8A878}
${color #F0C090}DISK${color} ${fs_used_perc /}%  ${fsbar 8,120 ffcc99 D8A878}
${color #F0C090}${stippled_hr 2}${color}
${color #00E5FF}NET${color}  ${upspeedf} up / ${downspeedf} down
${color #00E5FF}TS${color}   ${execi 30 tailscale status --peers=false --self=false 2>/dev/null || echo 'niet actief'}
${color #F0C090}${stippled_hr 2}${color}
${color #6B8399}UPTIME${color} $uptime
${color #6B8399}KERNEL${color} $kernel
]]
