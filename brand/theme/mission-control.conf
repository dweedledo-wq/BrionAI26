# BrionAI26-mission-control-thema — alle kleuren op één plek.
# Aanpassen = dit bestand bewerken, ISO opnieuw bouwen. Niks anders nodig.
# Palet afgestemd op het BrionAI26-logo (goud/amber dominant).

BG_DEEP="#0A0E12"        # achtergrond diep (bureaublad)
BG_PANEL="#131A21"        # tegelpanelen, taakbalk
GLASS_ALPHA="0.72"         # picom-glas-transparantie
ACCENT_GOLD="#D8A878"      # primair accent (logo-goud)
ACCENT_GOLD_BRIGHT="#F0C090" # hotkeys, klok, geselecteerde tegel
ACCENT_CYAN="#00E5FF"      # secundair accent (AI-tegels)
WARN_AMBER="#FFB300"       # waarschuwing
CRIT_RED="#FF3B4E"          # fout/kritiek
TEXT_MAIN="#D7E6F0"         # HUD-tekst primair
TEXT_DIM="#6B8399"          # HUD-tekst secundair
HUD_FONT="Monospace Bold"   # HUD-lettertype
