# BrionAI26 mission-control thema -- alle kleuren op een plek.
# Aanpassen = dit bestand bewerken, ISO opnieuw bouwen. Niks anders nodig.
# Palet: staalblauw (FUI-doelplaat v2, uit de referentiefoto van Brionize).
# Goud is alleen voor het merk (BRIONAI26-naam, logo, splash/GRUB/login).

BG_DEEP="#060B16"          # achtergrond diep (bureaublad, splash, GRUB)
BG_PANEL="#0A1424"          # tegelpanelen, taakbalk, rasterlijnen
GLASS_ALPHA="0.72"          # picom-glas-transparantie
ACCENT_STEEL="#2683C0"      # primair accent (data, meters, laadbalk)
ACCENT_STEEL_BRIGHT="#3270C5" # secundair accent (grafieken, geselecteerd)
ACCENT_GOLD="#F0C090"       # ALLEEN merk: BRIONAI26-naam, logo
WARN_AMBER="#FFB300"        # waarschuwing
CRIT_RED="#FF3B4E"          # fout/kritiek
TEXT_MAIN="#CDD8E1"         # HUD-tekst primair
TEXT_DIM="#7A93B8"          # HUD-tekst secundair
TEXT_FAINT="#3E5A7E"        # HUD-tekst uitgeschakeld/kaders
HUD_FONT="Monospace Bold"   # HUD-lettertype
